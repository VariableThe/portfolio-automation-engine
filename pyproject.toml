[project]
name = "portfolio-automation"
version = "0.1.0"
description = "Portfolio Automation Engine for Indian Brokers"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Portfolio Automation", email = "dev@example.com" },
]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "rich>=13.0",
    "simpleeval>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "plyer>=2.1",
    "python-dateutil>=2.9",
    "aiohttp>=3.14.1",
]

[project.optional-dependencies]
zerodha = ["kiteconnect>=5.0"]
discord = ["discord-webhook>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "alembic>=1.13",
    "freezegun>=1.5",
]

[project.scripts]
portfolio-automation = "portfolio_automation.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "N818"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
